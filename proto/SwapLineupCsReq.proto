syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "ExtraLineupType.proto";

message SwapLineupCsReq {
  optional uint32 dst_slot = 12;
  optional uint32 index = 13;
  optional uint32 plane_id = 3;
  optional uint32 src_slot = 9;
  optional ExtraLineupType extra_lineup_type = 2;
  optional bool is_virtual = 6;
}
