syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "AvatarType.proto";
import "ExtraLineupType.proto";

message QuitLineupCsReq {
  optional uint32 plane_id = 2;
  optional uint32 index = 11;
  optional uint32 base_avatar_id = 9;
  optional ExtraLineupType extra_lineup_type = 15;
  optional AvatarType avatar_type = 6;
  optional bool is_virtual = 4;
}
