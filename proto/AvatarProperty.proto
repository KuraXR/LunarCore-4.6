syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message AvatarProperty {
  optional double max_hp = 1;
  optional double attack = 2;
  optional double defence = 3;
  optional double speed = 4;
  optional double left_hp = 5;
  optional double left_sp = 6;
  optional double max_sp = 7;
}
