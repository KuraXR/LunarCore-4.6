syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "BattleAvatar.proto";
import "BattleEndStatus.proto";
import "ItemList.proto";

message PVEBattleResultScRsp {
  optional uint32 stage_id = 15;
  optional uint32 event_id = 4;
  optional uint32 battle_id = 5;
  optional uint32 retcode = 9;
  optional BattleEndStatus end_status = 8;
  optional bool check_identical = 11;
  optional ItemList drop_data = 3;
  optional ItemList extra_drop_data = 2;
  optional ItemList unk_item_list_2 = 14;
  optional ItemList unk_item_list_3 = 1716;
  optional string res_version = 6;
  optional string bin_version = 13;
  repeated BattleAvatar battle_avatar_list = 12;
}
