syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "RelicAffix.proto";

message DisplayRelicInfo {
  optional uint32 level = 7;
  optional uint32 exp = 3;
  optional uint32 main_affix_id = 9;
  optional uint32 tid = 2;
  optional uint32 slot = 8;
  repeated RelicAffix sub_affix_list = 10;
}
