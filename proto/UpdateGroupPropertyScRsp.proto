syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message UpdateGroupPropertyScRsp {
  optional uint32 retcode = 5;
  optional uint32 floor_id = 10;
  optional uint32 group_id = 8;
  optional sint32 cur_property_value = 14;
  optional string property_name = 3;
  optional sint32 cur_property_value_alt = 15;
}
