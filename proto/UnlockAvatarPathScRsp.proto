syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "ItemList.proto";
import "MultiPathAvatarType.proto";

message UnlockAvatarPathScRsp {
  optional uint32 retcode = 12;
  optional MultiPathAvatarType avatar_id = 5;
  optional ItemList reward_list = 2;
  repeated uint32 basic_type_id_list = 3;
}
