syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message Avatar {
  optional uint64 first_met_timestamp = 9;
  optional uint32 promotion = 13;
  optional uint32 level = 4;
  optional uint32 base_avatar_id = 15;
  optional uint32 changed_avatar_type = 2;
  optional uint32 exp = 14;
  optional bool is_marked = 10;
  repeated uint32 taken_rewards = 12;
}
