syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "HeroBasicType.proto";
import "ItemList.proto";

message UnlockHeroBasicTypeScRsp {
  optional uint32 retcode = 3;
  optional HeroBasicType basic_type = 8;
  optional ItemList reward = 1;
  repeated uint32 unlocked_basic_types = 12;
}
