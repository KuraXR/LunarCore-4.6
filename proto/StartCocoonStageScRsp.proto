syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "SceneBattleInfo.proto";

message StartCocoonStageScRsp {
  optional uint32 wave = 8;
  optional uint32 retcode = 9;
  optional uint32 prop_entity_id = 1;
  optional uint32 cocoon_id = 13;
  optional SceneBattleInfo battle_info = 4;
}
