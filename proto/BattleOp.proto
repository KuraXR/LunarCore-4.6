syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message BattleOp {
  optional uint32 turn_counter = 1;
  optional uint32 state = 2;
  optional uint32 action_entity_id = 3;
  optional uint32 target_entity_id = 4;
  optional uint32 op_type = 5;
  optional uint32 skill_index = 6;
  optional uint32 operation_counter = 7;
}
