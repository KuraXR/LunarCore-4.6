syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "AvatarPathSkillTree.proto";
import "EquipRelic.proto";

message AvatarPathInfo {
  optional uint64 first_met_timestamp = 13;
  optional uint32 avatar_skin = 14;
  optional uint32 avatar_id = 3;
  optional uint32 rank = 10;
  optional uint32 path_equipment_id = 2;
  optional uint32 enhance_id = 1;
  repeated AvatarPathSkillTree skilltree_list = 9;
  repeated EquipRelic equip_relic_list = 12;
}
