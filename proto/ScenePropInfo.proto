syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "PropExtraInfo.proto";

message ScenePropInfo {
  optional uint64 create_time_ms = 13;
  optional uint32 life_time_ms = 6;
  optional uint32 prop_state = 5;
  optional uint32 prop_id = 2;
  optional PropExtraInfo extra_info = 15;
  repeated string trigger_name_list = 4;
}
