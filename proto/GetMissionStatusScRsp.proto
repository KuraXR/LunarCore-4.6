syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "MainMissionCustomValue.proto";
import "Mission.proto";

message GetMissionStatusScRsp {
  optional uint32 retcode = 7;
  repeated uint32 curversion_finished_main_mission_id_list = 5;
  repeated uint32 disabled_main_mission_id_list = 9;
  repeated uint32 unfinished_main_mission_id_list = 3;
  repeated uint32 finished_main_mission_id_list = 14;
  repeated Mission sub_mission_status_list = 2;
  repeated MainMissionCustomValue main_mission_mcv_list = 12;
}
