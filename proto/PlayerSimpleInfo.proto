syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "AssistSimpleInfo.proto";
import "FriendOnlineStatus.proto";
import "PlatformType.proto";

message PlayerSimpleInfo {
  optional int64 logout_time = 8;
  optional uint32 uid = 1;
  optional uint32 chat_bubble = 12;
  optional uint32 head_icon = 4;
  optional uint32 level = 3;
  optional PlatformType platform = 9;
  optional FriendOnlineStatus online_status = 7;
  optional bool is_banned = 6;
  optional string nickname = 2;
  optional string signature = 5;
  optional string platform_uuid = 10;
  optional string platform_nick = 11;
  repeated AssistSimpleInfo assist_info_list = 13;
}
