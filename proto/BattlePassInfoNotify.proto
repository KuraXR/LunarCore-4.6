syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message BattlePassInfoNotify {
  enum BpTierType {
    BP_TIER_TYPE_NONE = 0;
    BP_TIER_TYPE_FREE = 1;
    BP_TIER_TYPE_PREMIUM_1 = 2;
    BP_TIER_TYPE_PREMIUM_2 = 3;
  }
  optional uint32 exp = 7;
  optional uint32 cur_bp_id = 13;
  optional uint32 cur_week_add_exp_sum = 12;
  optional uint32 level = 8;
  optional BattlePassInfoNotify.BpTierType bp_tier_type = 10;
}
