syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "PlayerSimpleInfo.proto";
import "PlayingState.proto";

message FriendListInfo {
  optional PlayingState playing_state = 15;
  optional bool is_marked = 13;
  optional PlayerSimpleInfo simple_info = 4;
  optional string remark_name = 2;
}
