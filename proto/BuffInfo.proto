syntax = "proto2";

option java_package = "emu.lunarcore.proto";

message BuffInfo {
  optional uint64 add_time_ms = 8;
  optional float life_time = 4;
  optional uint32 count = 12;
  optional uint32 buff_id = 3;
  optional uint32 level = 5;
  optional uint32 base_avatar_id = 9;
  map<string, float> dynamic_values = 6;
}
