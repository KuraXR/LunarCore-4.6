syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "AssistMonsterWave.proto";
import "MotionInfo.proto";

message SceneCastSkillCsReq {
  optional uint32 caster_id = 2;
  optional uint32 attacked_group_id = 13;
  optional uint32 skill_index = 4;
  optional MotionInfo target_motion = 5;
  repeated uint32 hit_target_entity_id_list = 6;
  repeated AssistMonsterWave assist_monster_wave_list = 7;
}
