syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "ItemCostList.proto";

message EquipmentQuickUpCsReq {
  optional uint32 target_level = 1;
  optional uint32 equipment_unique_id = 3;
  optional ItemCostList exp_item_cost_list = 9;
  optional ItemCostList promotion_item_cost_list = 12;
  optional uint32 target_promotion = 13;
}
