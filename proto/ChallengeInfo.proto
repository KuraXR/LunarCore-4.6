syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "ChallengeStatus.proto";
import "ChallengeStoryInfo.proto";
import "ExtraLineupType.proto";

message ChallengeInfo {
  optional uint32 round_count = 5;
  optional uint32 score = 6;
  optional uint32 challenge_id = 13;
  optional uint32 score_two = 15;
  optional ExtraLineupType extra_lineup_type = 14;
  optional ChallengeStatus status = 3;
  optional ChallengeStoryInfo ext_info = 9;
}
