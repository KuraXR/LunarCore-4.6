syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "MotionInfo.proto";
import "Vector.proto";

message RotateMapCsReq {
  message Vector4 {
    optional float z = 4;
    optional float w = 8;
    optional float x = 9;
    optional float y = 14;
  }
  message NewMapRot {
    optional RotateMapCsReq.Vector4 vector4 = 8;
    optional Vector vector3 = 11;
  }
  optional uint32 group_id = 15;
  optional MotionInfo motion = 5;
}
