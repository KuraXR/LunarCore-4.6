syntax = "proto2";

option java_package = "emu.lunarcore.proto";

import "HeadIcon.proto";
import "HeadIconFrameInfo.proto";

message BoardDataSync {
  optional HeadIconFrameInfo head_icon_frame_info = 14;
  optional string signature = 13;
  repeated uint32 unlocked_head_icon_frame_id_list = 7;
  repeated HeadIcon unlocked_head_icon_list = 6;
}
